name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify package output
        run: node scripts/verify-package.js

      - name: Pack dry run
        run: npm pack --dry-run --json

      - name: Install packed tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm pack --pack-destination /tmp
          npm install --global /tmp/nehanahmed-forge-*.tgz
          test -x "$(command -v forge)"
          set +e
          forge > /tmp/forge-non-tty.log 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -q "interactive terminal" /tmp/forge-non-tty.log
