name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        shell: bash
        run: |
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); const tag=process.env.GITHUB_REF_NAME; if ('v'+p.version !== tag) { console.error('Tag/version mismatch:', tag, p.version); process.exit(1); }"

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Build first so the CLI smoke test can execute dist/cli/app.js.
      - name: Build
        run: pnpm build

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify package output
        run: node scripts/verify-package.js

      - name: Pack dry run
        run: npm pack --dry-run --json

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_COMMIT=$(git rev-parse HEAD)

          if npm view "@nehanahmed/forge@$VERSION" version >/dev/null 2>&1; then
            PUBLISHED_HEAD=$(npm view "@nehanahmed/forge@$VERSION" gitHead 2>/dev/null || true)
            if [ -z "$PUBLISHED_HEAD" ] || [ "$PUBLISHED_HEAD" != "$TAG_COMMIT" ]; then
              echo "Refusing to continue: version $VERSION is already published from ${PUBLISHED_HEAD:-an unknown commit}, not from $TAG_COMMIT." >&2
              exit 1
            fi
            echo "Version $VERSION is already published from this commit; skipping npm publish."
          else
            if [[ "$VERSION" == *-* ]]; then
              NPM_TAG=next
            else
              NPM_TAG=latest
            fi
            npm publish --tag "$NPM_TAG" --provenance --access public
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
